# golangci-lint v2 configuration. See https://golangci-lint.run/usage/configuration/
version: "2"

linters:
  # v2 "standard" = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  settings:
    staticcheck:
      checks:
        - all
        # Quickfix suggestions (transformations that are not defects) and style
        # checks are out of scope for this codebase.
        - -QF*
        - -ST*
    govet:
      # ReadByte/WriteByte/Seek methods intentionally use the wazero-specific
      # signatures on api.File/sys.File, not the io.Reader/Writer ones.
      disable:
        - stdmethods
  exclusions:
    # Carries the v1-era default exclusions, including the std-error-handling
    # rule that ignores best-effort calls whose error cannot usefully be
    # handled, e.g. `defer f.Close()`.
    presets:
      - std-error-handling
    rules:
      # Matches golangci-lint v1's default EXC0001: best-effort calls whose
      # error cannot usefully be handled, e.g. `defer f.Close()`.
      - source: "(Error return value of .((os\\.)?std(out|err)\\..*|.*Close|.*Flush|os\\.Remove(All)?|.*print(f|ln)?|os\\.(Un)?Setenv). is not checked)"
        linters:
          - errcheck
      # Functions declared in Go but implemented in assembly are reported as
      # unused by design.
      - path: internal/engine/wazevo/backend/isa/(amd64|arm64)/abi_entry.*
        text: "is unused"
        linters:
          - unused
